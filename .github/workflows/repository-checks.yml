name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  source-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source syntax and repository resources
        run: python tests/check_repository.py
  conda-dependencies:
    runs-on: ubuntu-latest
    needs: source-and-assets
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: soft_robotics_sim
          environment-file: environment/environment.yml
          auto-activate-base: false
          miniforge-version: latest
          use-mamba: true
      - name: Verify research dependencies and load artifacts
        shell: bash -el {0}
        env:
          WANDB_MODE: disabled
          MPLBACKEND: Agg
        run: python tests/check_runtime.py
